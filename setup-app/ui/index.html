<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kipple Setup</title>
<!-- The first-install window. Colors and type follow the app (src/App.css); art from brand/. -->
<style>
:root{--bg:#f5f3ef;--panel:#fffdf9;--ink:#23211e;--muted:#77726a;--line:#e3dfd7;--accent:#d9573b;--accent-soft:#fbe7e0;--card:#fffdf9;--danger:#c0392b;
  font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;font-size:14px;color:var(--ink);background:var(--bg);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#171614;--panel:#252320;--ink:#eeeae4;--muted:#9d978e;--line:#36332f;--accent:#f07a5f;--accent-soft:#3a2621;--card:#2e2b27;--danger:#ef6b5b;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;user-select:none;cursor:default}
.win{height:100vh;display:flex;flex-direction:column;position:relative}
.bar{height:36px;display:flex;align-items:center;justify-content:flex-end;padding:0 6px;flex:none}
.bar button{width:34px;height:26px;border:0;background:none;color:var(--muted);border-radius:6px;font-size:13px}
.bar button:hover{background:rgba(127,127,127,.15)}.bar button.x:hover{background:#c42b1c;color:#fff}
.stage{flex:1;display:grid;grid-template-columns:230px 1fr;align-items:center;padding:0 36px 34px 18px;pointer-events:none}
.stage button,.stage label,.stage .opts{pointer-events:auto}
.art{position:relative;height:230px}
.mascot{position:absolute;left:50%;top:50%;width:132px;height:132px;transform:translate(-50%,-50%);animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-56%) rotate(-2deg)}}
/* The kipple: messages, links and photos. Positions and the intro are driven from JS (Web Animations). */
.art{overflow:visible}
.it{position:absolute;left:0;top:0;width:46px;height:30px;border-radius:7px;background:var(--card);box-shadow:0 2px 7px rgba(40,30,20,.14);opacity:0;will-change:transform}
.it.msg{border-bottom-left-radius:2px}
.it.msg::before{content:"";position:absolute;left:7px;top:8px;width:20px;height:4px;border-radius:2px;background:var(--accent)}
.it.msg::after{content:"";position:absolute;left:7px;top:17px;width:30px;height:4px;border-radius:2px;background:var(--line)}
.it.link{height:24px;border-radius:12px}
.it.link::before{content:"";position:absolute;left:7px;top:7px;width:7px;height:7px;border:2px solid var(--accent);border-radius:50%;box-shadow:5px 0 0 -2px var(--card),5px 0 0 0 var(--accent)}
.it.link::after{content:"";position:absolute;left:22px;top:10px;width:17px;height:4px;border-radius:2px;background:var(--line)}
.it.pic{width:38px;height:32px;background:var(--accent-soft);overflow:hidden}
.it.pic::before{content:"";position:absolute;right:7px;top:6px;width:7px;height:7px;border-radius:50%;background:#f2a58f}
.it.pic::after{content:"";position:absolute;left:-2px;bottom:-1px;width:44px;height:18px;background:var(--accent);opacity:.75;clip-path:polygon(0 100%,30% 25%,52% 70%,70% 40%,100% 100%)}
.text{opacity:1}
.intro .text{opacity:0}
.mascot{opacity:1}
.intro .mascot{opacity:0}
.done .it{opacity:0!important;transition:opacity .2s}
.done .mascot{animation:hop .9s cubic-bezier(.3,1.6,.5,1) 1}
@keyframes hop{0%{transform:translate(-50%,-50%) scale(.85)}100%{transform:translate(-50%,-50%) scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.wm{width:104px;height:42px;color:var(--ink);display:block;margin-bottom:6px}
h1{font-size:22px;line-height:1.25;margin:0 0 6px;font-weight:650;letter-spacing:-.01em}
p{margin:0;color:var(--muted);line-height:1.45}
.btn{margin-top:24px;display:inline-flex;align-items:center;height:44px;padding:0 26px;border-radius:12px;border:0;background:var(--accent);color:#fff;font:inherit;font-size:15px;font-weight:600;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 35%,transparent);transition:transform .12s,filter .12s;outline:none}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}.btn:active{transform:translateY(1px)}
.btn:focus-visible{box-shadow:0 0 0 3px var(--accent-soft),0 6px 16px color-mix(in srgb,var(--accent) 35%,transparent)}
.row{display:flex;align-items:center;gap:16px}
.link{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;margin-top:24px;padding:0;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line);outline:none}
.link:hover{color:var(--ink)}
.opts{margin-top:14px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;font-size:13px;color:var(--muted);display:grid;gap:8px}
.dir{display:flex;gap:8px;align-items:center}.dir code{flex:1;color:var(--ink);font-family:inherit;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dir .link{margin:0}
.chk{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:13px}
.chk input{appearance:none;margin:0;width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line);display:grid;place-items:center;outline:none}
.chk input:checked{background:var(--accent);border-color:var(--accent)}
.chk input:checked::after{content:"";width:8px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.s3 .chk{margin-top:18px}
.prog{margin-top:22px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.prog b{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--accent),#f2a58f);transition:width .4s ease-out}
.step{margin-top:10px;font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between}
.err{margin-top:12px;color:var(--danger);font-size:13px;user-select:text}
.foot{position:absolute;left:18px;right:18px;bottom:10px;font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;opacity:.8;pointer-events:none}
.screen{display:none}.win[data-s="1"] .s1,.win[data-s="2"] .s2,.win[data-s="3"] .s3,.win[data-s="4"] .s4{display:block}
</style>
</head>
<body>
<div class="win intro" id="win" data-s="1" data-tauri-drag-region>
  <div class="bar" data-tauri-drag-region>
    <button id="min" data-t="minimize" tabindex="-1">&#x2013;</button><button id="close" class="x" data-t="close" tabindex="-1">&#x2715;</button>
  </div>
  <div class="stage" data-tauri-drag-region>
    <div class="art" data-tauri-drag-region>
      <span class="it msg"></span><span class="it link"></span><span class="it pic"></span><span class="it link"></span><span class="it msg"></span><span class="it pic"></span><span class="it link extra"></span><span class="it msg extra"></span><span class="it pic extra"></span><span class="it msg extra"></span><span class="it link extra"></span><span class="it msg extra"></span><span class="it pic extra"></span><span class="it link extra"></span>
      <svg class="mascot" viewBox="0 0 100 100" aria-hidden="true"><g transform="translate(50 56) scale(1.04 0.97) translate(-50 -56)"><path d="M50.00 23.70 L51.84 23.25 L53.81 22.21 L55.90 21.30 L57.94 21.20 L59.75 22.17 L61.23 23.91 L62.55 25.70 L64.01 26.90 L65.86 27.29 L68.09 27.21 L70.37 27.29 L72.26 28.09 L73.46 29.75 L74.04 31.96 L74.46 34.15 L75.25 35.86 L76.75 37.02 L78.79 37.91 L80.81 38.97 L82.16 40.51 L82.52 42.53 L82.09 44.77 L81.52 46.92 L81.49 48.81 L82.33 50.51 L83.79 52.19 L85.15 54.03 L85.70 56.00 L85.15 57.97 L83.79 59.81 L82.33 61.49 L81.49 63.19 L81.52 65.08 L82.09 67.23 L82.52 69.47 L82.16 71.49 L80.81 73.03 L78.79 74.09 L76.75 74.98 L75.25 76.14 L74.46 77.85 L74.04 80.04 L73.46 82.25 L72.26 83.91 L70.37 84.71 L68.09 84.79 L65.86 84.71 L64.01 85.10 L62.55 86.30 L61.23 88.09 L59.75 89.83 L57.94 90.80 L55.90 90.70 L53.81 89.79 L51.84 88.75 L50.00 88.30 L48.16 88.75 L46.19 89.79 L44.10 90.70 L42.06 90.80 L40.25 89.83 L38.77 88.09 L37.45 86.30 L35.99 85.10 L34.14 84.71 L31.91 84.79 L29.63 84.71 L27.74 83.91 L26.54 82.25 L25.96 80.04 L25.54 77.85 L24.75 76.14 L23.25 74.98 L21.21 74.09 L19.19 73.03 L17.84 71.49 L17.48 69.47 L17.91 67.23 L18.48 65.08 L18.51 63.19 L17.67 61.49 L16.21 59.81 L14.85 57.97 L14.30 56.00 L14.85 54.03 L16.21 52.19 L17.67 50.51 L18.51 48.81 L18.48 46.92 L17.91 44.77 L17.48 42.53 L17.84 40.51 L19.19 38.97 L21.21 37.91 L23.25 37.02 L24.75 35.86 L25.54 34.15 L25.96 31.96 L26.54 29.75 L27.74 28.09 L29.63 27.29 L31.91 27.21 L34.14 27.29 L35.99 26.90 L37.45 25.70 L38.77 23.91 L40.25 22.17 L42.06 21.20 L44.10 21.30 L46.19 22.21 L48.16 23.25 L50.00 23.70Z" fill="#D9573B"/></g><g transform="rotate(22 62 20)"><rect x="53" y="12" width="18" height="15" rx="4" fill="#F2A58F" /></g><path d="M32.5 46 Q38 38.5 43.5 46" fill="none" stroke="#23211E" stroke-width="4.6" stroke-linecap="round"/><path d="M56.5 46 Q62 38.5 67.5 46" fill="none" stroke="#23211E" stroke-width="4.6" stroke-linecap="round"/><path d="M46 53 Q50 56.5 54 53" fill="none" stroke="#23211E" stroke-width="3.2" stroke-linecap="round"/><g transform="rotate(-5 50 71)"><rect x="32" y="60" width="36" height="24" rx="5.5" fill="#FFFDF9" /><rect x="38" y="66" width="13" height="4.2" rx="2.1" fill="#D9573B" /><rect x="38" y="73.5" width="23" height="4.2" rx="2.1" fill="#E9DFD3" /></g><circle cx="32.5" cy="72" r="5.8" fill="#D9573B"/><circle cx="67.5" cy="70" r="5.8" fill="#D9573B"/></svg>
    </div>
    <div class="text" data-tauri-drag-region>
      <div class="screen s1">
        <svg class="wm" viewBox="-2 -1 246 98" aria-label="Kipple"><path fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" d="M6 10 V70"/><path fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" d="M34 32 L8 54 M19 45 L36 70"/><path fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" d="M52 32 V70"/><rect x="45.5" y="5.5" width="13" height="13" rx="3.5" fill="var(--accent)" transform="rotate(14 52 12)"/><path fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" d="M70 32 V90"/><circle fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" cx="88" cy="51" r="19"/><path fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" d="M126 32 V90"/><circle fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" cx="144" cy="51" r="19"/><path fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" d="M182 10 V70"/><path fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" d="M199 51 H237 A19 19 0 1 0 230.4 65.4"/></svg>
        <h1 data-t="title"></h1>
        <p data-t="lead"></p>
        <div class="row"><button class="btn" id="go" data-t="install"></button><button class="link" id="more" data-t="options"></button></div>
        <div class="opts" id="opts" hidden>
          <div class="dir"><code id="dir"></code><button class="link" id="browse" data-t="change"></button></div>
          <label class="chk"><input type="checkbox" id="desk" checked><span data-t="desktop"></span></label>
        </div>
      </div>
      <div class="screen s2">
        <h1 data-t="installing"></h1>
        <p data-t="installingLead"></p>
        <div class="prog"><b id="bar"></b></div>
        <div class="step"><span data-t="copying"></span><span id="pct">0%</span></div>
      </div>
      <div class="screen s3">
        <h1 data-t="done"></h1>
        <p data-t="doneLead"></p>
        <button class="btn" id="open" data-t="open"></button>
      </div>
      <div class="screen s4">
        <h1 data-t="failed"></h1>
        <p data-t="failedLead"></p>
        <div class="err" id="err"></div>
        <button class="btn" id="retry" data-t="retry"></button>
      </div>
    </div>
  </div>
  <div class="foot"><span id="ver">Kipple</span><span data-t="perUser"></span></div>
</div>
<script>
const T = {
  ru: {
    minimize: "Свернуть", close: "Закрыть",
    title: "Приручите свои сохранёнки",
    lead: "«Избранное» Telegram в виде доски, где всё разложено по темам. Данные остаются на вашем компьютере.",
    install: "Установить", update: "Обновить", options: "Параметры", change: "Изменить",
    desktop: "Ярлык на рабочем столе",
    installing: "Устанавливаем…", installingLead: "Раскладываем карточки по полкам. Это займёт несколько секунд.",
    copying: "Копируем файлы",
    done: "Готово!", doneLead: "Kipple установлен. Его можно найти в меню «Пуск».", open: "Открыть Kipple",
    failed: "Не получилось установить", failedLead: "Закройте Kipple, если он открыт, и попробуйте ещё раз.", retry: "Попробовать ещё раз",
    perUser: "Без прав администратора · только для вас",
    installed: v => `Установлена версия ${v}`,
  },
  en: {
    minimize: "Minimize", close: "Close",
    title: "Tame your saved messages",
    lead: "Your Telegram Saved Messages as a board, sorted by topic. Your data stays on this computer.",
    install: "Install", update: "Update", options: "Options", change: "Change",
    desktop: "Desktop shortcut",
    installing: "Installing…", installingLead: "Putting the cards on their shelves. This takes a few seconds.",
    copying: "Copying files",
    done: "All set!", doneLead: "Kipple is installed. You'll find it in the Start menu.", open: "Open Kipple",
    failed: "Couldn't install", failedLead: "Close Kipple if it's running and try again.", retry: "Try again",
    perUser: "No admin rights needed · just for you",
    installed: v => `Version ${v} is installed`,
  },
};
const lang = (navigator.language || "en").toLowerCase().startsWith("ru") ? "ru" : "en";
const t = T[lang];
document.documentElement.lang = lang;
document.querySelectorAll("[data-t]").forEach(el => {
  const v = t[el.dataset.t];
  if (el.tagName === "BUTTON" && el.closest(".bar")) el.title = v; else el.textContent = v;
});

const $ = id => document.getElementById(id);
const tauri = window.__TAURI__;
const invoke = tauri ? tauri.core.invoke : async (cmd) => {
  // Opened in a browser: a demo of the screens.
  if (cmd === "info") return { version: "0.1.0", installedVersion: null, installDir: "C:\\Users\\you\\AppData\\Local\\Kipple" };
  if (cmd === "install") return new Promise(r => setTimeout(r, 3500));
  if (cmd === "launch") return show(1);
};
const appWin = tauri ? tauri.window.getCurrentWindow() : null;


// ---- Motion: the kipple flies around, Kipple arrives and tames it into neat rows. ----
const items = [...document.querySelectorAll(".it")];
const mascot = document.querySelector(".mascot");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const ART = 230, MID = ART / 2;
const size = el => [el.offsetWidth, el.offsetHeight];
// Tidy board: one column per kind (messages, links, photos), one row above and one below Kipple.
const COLS = { msg: 40, link: 115, pic: 190 };
const seen = {};
const tidy = items.map(el => {
  const kind = el.classList[1];
  const [w, h] = size(el);
  // The extra ones are eaten by Kipple at the end of the intro.
  if (el.classList.contains("extra")) return { x: MID - w / 2, y: MID - h / 2, gone: true };
  const row = seen[kind] = (seen[kind] || 0) + 1;
  return { x: COLS[kind] - w / 2, y: row === 1 ? 22 - h / 2 : 208 - h / 2 };
});
const tf = (x, y, r = 0, k = 1) => `translate(${x}px, ${y}px) rotate(${r}deg) scale(${k})`;
const rnd = (a, b) => a + Math.random() * (b - a);
const place = () => items.forEach((el, i) => { el.style.transform = tf(tidy[i].x, tidy[i].y, 0, tidy[i].gone ? 0.2 : 1); el.style.opacity = tidy[i].gone ? 0 : 1; });

function intro() {
  const win = $("win");
  if (reduced) { place(); win.classList.remove("intro"); return; }
  items.forEach((el, i) => {
    const [w, h] = size(el);
    const wild = () => tf(rnd(-10, 500 - w), rnd(-30, ART + 40 - h), rnd(-50, 50), rnd(0.85, 1.2));
    const t = tidy[i];
    el.animate([
      { transform: wild(), opacity: 0 },
      { transform: wild(), opacity: 1, offset: 0.12 },
      { transform: wild(), offset: 0.32 },
      { transform: wild(), offset: 0.5 },
      { transform: wild(), offset: 0.66, easing: "cubic-bezier(.2,.9,.3,1.18)" },
      t.gone ? { transform: tf(t.x, t.y, 30, 0.2), opacity: 0 } : { transform: tf(t.x, t.y), opacity: 1 },
    ], { duration: 2500 + (i % 7) * 90, easing: "ease-in-out", fill: "forwards" });
  });
  setTimeout(() => {
    win.classList.remove("intro");
    mascot.animate([
      { transform: "translate(-50%, 30%) scale(.5) rotate(-12deg)", opacity: 0 },
      { transform: "translate(-50%, -62%) scale(1.08) rotate(4deg)", opacity: 1, offset: 0.6 },
      { transform: "translate(-50%, -50%) scale(1) rotate(0)" },
    ], { duration: 700, easing: "cubic-bezier(.3,1.3,.5,1)" });
    document.querySelector(".text").animate(
      [{ opacity: 0, transform: "translateY(10px)" }, { opacity: 1, transform: "none" }],
      { duration: 600, delay: 1000, easing: "ease-out", fill: "backwards" });
  }, 1450);
}

// While installing, Kipple swallows the cards one by one and they reappear on the board, on a loop.
let loops = [];
function swallow(on) {
  loops.forEach(a => a.cancel());
  loops = [];
  if (!on || reduced) return;
  items.forEach((el, i) => {
    const [w, h] = size(el);
    const t = tidy[i];
    if (t.gone) return;
    loops.push(el.animate([
      { transform: tf(t.x, t.y), opacity: 1, easing: "cubic-bezier(.5,0,.75,0)" },
      { transform: tf(MID - w / 2, MID - h / 2, 20, 0.2), opacity: 0, offset: 0.4 },
      { transform: tf(t.x, t.y, 0, 0.6), opacity: 0, offset: 0.75, easing: "ease-out" },
      { transform: tf(t.x, t.y), opacity: 1 },
    ], { duration: 2200, delay: i * 260, iterations: Infinity }));
  });
}

let dir = "";
function show(s) {
  const w = $("win");
  w.dataset.s = s;
  w.classList.toggle("installing", s === 2);
  swallow(s === 2);
  w.classList.toggle("done", s === 3);
  const focus = { 1: "go", 3: "open", 4: "retry" }[s];
  if (focus) setTimeout(() => $(focus).focus(), 50);
}

// NSIS reports no progress in silent mode, so the bar eases toward 90% and jumps to 100% at the end.
let timer = null;
function progress(on) {
  clearInterval(timer);
  let p = 0;
  const set = v => { $("bar").style.width = v + "%"; $("pct").textContent = Math.round(v) + "%"; };
  if (!on) return set(100);
  set(2);
  timer = setInterval(() => { p += (90 - p) * 0.06; set(p); }, 120);
}

async function install() {
  show(2);
  progress(true);
  try {
    await invoke("install", { dir, desktopShortcut: $("desk").checked });
    progress(false);
    setTimeout(() => show(3), 450);
  } catch (e) {
    clearInterval(timer);
    $("err").textContent = String(e);
    show(4);
  }
}

$("go").onclick = install;
$("retry").onclick = install;
$("open").onclick = () => invoke("launch").catch(e => { $("err").textContent = String(e); show(4); });
$("more").onclick = () => { $("opts").hidden = !$("opts").hidden; };
$("browse").onclick = async () => {
  const picked = await invoke("pick_dir", { current: dir });
  if (picked) { dir = picked; $("dir").textContent = dir; $("dir").title = dir; }
};
$("min").onclick = () => appWin && appWin.minimize();
$("close").onclick = () => appWin ? appWin.close() : null;
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("win").dataset.s !== "2") $("close").click(); });
document.addEventListener("contextmenu", e => e.preventDefault());

invoke("info").then(info => {
  dir = info.installDir;
  $("dir").textContent = dir; $("dir").title = dir;
  $("ver").textContent = "Kipple " + info.version;
  if (info.installedVersion) {
    $("go").textContent = t.update;
    $("ver").textContent += " · " + t.installed(info.installedVersion);
  }
  const demo = new URLSearchParams(location.search).get("s");
  place();
  show(demo ? +demo : 1);
  if (!demo) intro(); else $("win").classList.remove("intro");
  if (demo === "2") progress(true);
}).finally(() => appWin && appWin.show());
</script>
</body>
</html>
