name: build
# Title of each run in the Actions list:
#   manual run:   "Test build #267 · main" (same build number as the kipple-test-...-build267-... archive)
#   pull request: "Checks · PR #91 · <PR title>"
#   push to main: "Checks · main · <commit message>"
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('Test build #{0} · {1}', github.run_number, github.ref_name)
  || github.event_name == 'pull_request' && format('Checks · PR #{0} · {1}', github.event.pull_request.number, github.event.pull_request.title)
  || format('Checks · {0} · {1}', github.ref_name, github.event.head_commit.message) }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:web
      # Smoke tests of the main flows in the browser build with the sample library (e2e/, playwright.config.ts).
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=web
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: smoke-web-report
          path: |
            e2e-report
            e2e-results
          retention-days: 7

  # The Windows installer is slow, so it is built only on a manual run (Actions -> build -> Run workflow).
  windows:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            setup-app/src-tauri
      - run: npm ci
      # Signs the update bundle when the signing key secret exists; otherwise builds without update artifacts.
      - name: Build installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Optional: Telegram app credentials from my.telegram.org, so users don't enter their own.
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          # Test build (version 0.1.0): without this the updater would replace it with the latest release.
          KIPPLE_TEST_BUILD: "1"
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build
          else
            npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi
      - name: Build Kipple Setup (branded first-install window)
        shell: bash
        run: setup-app/build.sh
      # Each test build gets its own name, e.g. kipple-test-2026-11-15-build267-abdee49, so archives can be told apart.
      - name: Name the build
        shell: bash
        run: echo "ARTIFACT=kipple-test-$(date -u +%F)-build${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            Install-Kipple-*.exe
          if-no-files-found: error
      # The same smoke tests against the real app, after the archive is uploaded so a failure never costs the
      # test build: installs it, starts it with WebView2's DevTools port and opens the sample library
      # (a fresh runner has no library of its own).
      - name: Smoke test the installed app
        shell: pwsh
        run: scripts/test-build.ps1 -Installer (Get-Item src-tauri/target/release/bundle/nsis/*-setup.exe).FullName -Out e2e-desktop
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-desktop-${{ github.run_number }}
          path: e2e-desktop
          retention-days: 14
