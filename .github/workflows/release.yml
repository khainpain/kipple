name: release

# Runs only on demand: Actions -> release -> Run workflow.
# Publishes a signed Windows release (v0.1.<run number> unless a version is given).
# Installed apps find it through latest.json and offer to update themselves.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.2.0 (empty = 0.1.<run number>). Must be higher than the last release."
        required: false
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - name: Set version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION#v}"
          if [ -z "$VERSION" ]; then VERSION="0.1.${{ github.run_number }}"; fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3, got '$VERSION'"; exit 1
          fi
          node -e "const f='src-tauri/tauri.conf.json',fs=require('fs'),c=JSON.parse(fs.readFileSync(f));c.version='$VERSION';fs.writeFileSync(f,JSON.stringify(c,null,2))"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Optional: Telegram app credentials from my.telegram.org, so users don't enter their own.
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        with:
          tagName: v__VERSION__
          releaseName: Saved Board v__VERSION__
          releaseBody: |
            Сборка из ${{ github.ref_name }} @ ${{ github.sha }}.
            Уже установленное приложение предложит обновиться само. Для первой установки скачай `Saved.Board_${{ env.VERSION }}_x64-setup.exe` ниже.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          # The generic "windows-x86_64" entry in latest.json points to the NSIS setup.exe,
          # not the MSI: a per-user NSIS install updates silently without admin rights.
          updaterJsonPreferNsis: true
