name: release
# Title in the Actions list: "Release v0.1.18 · main" (or "Release v0.1.<run number> · main" when no version is given).
run-name: >-
  ${{ inputs.version == '' && format('Release v0.1.{0} · {1}', github.run_number, github.ref_name)
  || startsWith(inputs.version, 'v') && format('Release {0} · {1}', inputs.version, github.ref_name)
  || format('Release v{0} · {1}', inputs.version, github.ref_name) }}

# Runs only on demand: Actions -> release -> Run workflow.
# Publishes a signed Windows release (v0.1.<run number> unless a version is given).
# Installed apps find it through latest.json and offer to update themselves.
#
# Where the release goes: this repository, unless the Actions variable RELEASE_REPO names another one
# (getkipple/kipple, the public home). Then the source of this commit, minus the .publicignore paths, is
# first published there as one commit "Kipple vX.Y.Z" tagged vX.Y.Z (scripts/publish-source.sh), and the
# release is made from that tag. Needs the secret PUBLIC_REPO_TOKEN: a fine-grained token for that
# repository with Contents read and write.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.2.0 (empty = 0.1.<run number>). Must be higher than the last release."
        required: false
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            setup-app/src-tauri
      - run: npm ci
      - run: npm test
      - name: Set version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION#v}"
          if [ -z "$VERSION" ]; then VERSION="0.1.${{ github.run_number }}"; fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3, got '$VERSION'"; exit 1
          fi
          node -e "const f='src-tauri/tauri.conf.json',fs=require('fs'),c=JSON.parse(fs.readFileSync(f));c.version='$VERSION';fs.writeFileSync(f,JSON.stringify(c,null,2))"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Publish the source
        id: source
        shell: bash
        env:
          RELEASE_REPO: ${{ vars.RELEASE_REPO }}
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          repo="${RELEASE_REPO:-$GITHUB_REPOSITORY}"
          echo "owner=${repo%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${repo#*/}" >> "$GITHUB_OUTPUT"
          if [ "$repo" = "$GITHUB_REPOSITORY" ]; then
            echo "repo=$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "token=github" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$PUBLIC_REPO_TOKEN" ]; then
            echo "::error::RELEASE_REPO is $RELEASE_REPO but the PUBLIC_REPO_TOKEN secret is missing"; exit 1
          fi
          sha="$(scripts/publish-source.sh "$RELEASE_REPO" "$VERSION")"
          echo "repo=$RELEASE_REPO" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "token=public" >> "$GITHUB_OUTPUT"
          echo "::notice title=Source::Published to https://github.com/$RELEASE_REPO/commit/$sha"
      # English notes: "What's new" from scripts/changelog.mjs (this version's entry, else "next").
      - name: Release notes
        id: notes
        shell: bash
        run: |
          {
            echo "body<<RELEASE_NOTES_EOF"
            node scripts/release-notes.mjs body "$VERSION" "${{ steps.source.outputs.token == 'public' && 'main' || github.ref_name }}" "${{ steps.source.outputs.sha }}"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ steps.source.outputs.token == 'public' && secrets.PUBLIC_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Optional: Telegram app credentials from my.telegram.org, so users don't enter their own.
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        with:
          owner: ${{ steps.source.outputs.owner }}
          repo: ${{ steps.source.outputs.name }}
          releaseCommitish: ${{ steps.source.outputs.token == 'public' && steps.source.outputs.sha || '' }}
          tagName: v__VERSION__
          releaseName: Kipple v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          # The generic "windows-x86_64" entry in latest.json points to the NSIS setup.exe,
          # not the MSI: a per-user NSIS install updates silently without admin rights.
          updaterJsonPreferNsis: true
      # The branded installer for first installs. Updates keep using the NSIS setup.exe above (latest.json).
      - name: Build and attach Kipple Setup
        shell: bash
        env:
          GH_TOKEN: ${{ steps.source.outputs.token == 'public' && secrets.PUBLIC_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_REPO: ${{ steps.source.outputs.owner }}/${{ steps.source.outputs.name }}
        run: |
          setup-app/build.sh
          gh release upload "v$VERSION" "Install-Kipple-$VERSION.exe" --clobber --repo "$RELEASE_REPO"
      # The landing page (its own Vercel project, khainpain/kipple-site) reads the version, installer
      # size and "What's new" when it is built, so rebuild it now that the release exists. Needs that
      # project's deploy hook URL in the VERCEL_DEPLOY_HOOK secret (Vercel → Settings → Git → Deploy
      # Hooks, branch main); skipped without it.
      - name: Rebuild the website
        shell: bash
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then curl -fsS -X POST "$HOOK" >/dev/null && echo "Website rebuild started"; else echo "No VERCEL_DEPLOY_HOOK secret, skipping"; fi
      # A reminder on the run's page: the help page is written by hand (CLAUDE.md, "Releasing a version").
      - name: Help page reminder
        shell: bash
        run: |
          echo "::notice title=Help page::Check that getkipple.io/docs/ describes v$VERSION: new features, renamed menus, sections marked Coming soon that ship now (kipple-site, docs in copy.mjs)."
