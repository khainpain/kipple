name: release

# Runs only on demand: Actions -> release -> Run workflow.
# Publishes a signed Windows release (v0.1.<run number> unless a version is given).
# Installed apps find it through latest.json and offer to update themselves.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.2.0 (empty = 0.1.<run number>). Must be higher than the last release."
        required: false
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            setup-app/src-tauri
      - run: npm ci
      - run: npm test
      - name: Set version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION#v}"
          if [ -z "$VERSION" ]; then VERSION="0.1.${{ github.run_number }}"; fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3, got '$VERSION'"; exit 1
          fi
          node -e "const f='src-tauri/tauri.conf.json',fs=require('fs'),c=JSON.parse(fs.readFileSync(f));c.version='$VERSION';fs.writeFileSync(f,JSON.stringify(c,null,2))"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      # English notes: "What's new" from scripts/changelog.mjs (this version's entry, else "next").
      - name: Release notes
        id: notes
        shell: bash
        run: |
          {
            echo "body<<RELEASE_NOTES_EOF"
            node scripts/release-notes.mjs body "$VERSION" "${{ github.ref_name }}" "${{ github.sha }}"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Optional: Telegram app credentials from my.telegram.org, so users don't enter their own.
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        with:
          tagName: v__VERSION__
          releaseName: Kipple v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          # The generic "windows-x86_64" entry in latest.json points to the NSIS setup.exe,
          # not the MSI: a per-user NSIS install updates silently without admin rights.
          updaterJsonPreferNsis: true
      # The branded installer for first installs. Updates keep using the NSIS setup.exe above (latest.json).
      - name: Build and attach Kipple Setup
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          setup-app/build.sh
          gh release upload "v$VERSION" "Install-Kipple-$VERSION.exe" --clobber
      # The landing page (its own Vercel project, khainpain/kipple-site) reads the version, installer
      # size and "What's new" when it is built, so rebuild it now that the release exists. Needs that
      # project's deploy hook URL in the VERCEL_DEPLOY_HOOK secret (Vercel → Settings → Git → Deploy
      # Hooks, branch main); skipped without it.
      - name: Rebuild the website
        shell: bash
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then curl -fsS -X POST "$HOOK" >/dev/null && echo "Website rebuild started"; else echo "No VERCEL_DEPLOY_HOOK secret, skipping"; fi
