<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Kipple stats</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
:root {
  --bg: #f5f3ef; --panel: #ffffff; --ink: #23211e; --ink-2: #4a463f; --muted: #6b665e; --line: #e3dfd7; --grid: #eeeae3;
  --accent: #d9573b; --accent-soft: #fbe7e0;
  /* One hue, light → dark, for install age (ordinal): 0–6 days, 7–13, 14+. */
  --seq-1: #f2b6a6; --seq-2: #e3795d; --seq-3: #b8432a;
  --ok: #1b7a43;
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Inter, Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #171614; --panel: #22201d; --ink: #eeeae4; --ink-2: #cfc9c0; --muted: #a39d94; --line: #36332f; --grid: #2c2a27;
    --accent: #f07a5f; --accent-soft: #3a2621;
    --seq-1: #6e3427; --seq-2: #c45a40; --seq-3: #f59a84;
    --ok: #5fcf8f;
  }
}
* { box-sizing: border-box; }
html, body { overflow-x: clip; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1120px; margin-inline: auto; padding: 0 16px 48px; }
header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 18px 8px; }
header h1 { font-size: 20px; margin: 0; }
header h1 span { color: var(--muted); font-weight: 500; }
.spacer { flex: 1; }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: none; color: var(--muted); font: inherit; font-size: 13px; padding: 4px 12px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.link { border: 0; background: none; color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.note { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
.demo { display: inline-block; background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 1px 8px; font-size: 12px; font-weight: 600; margin-left: 8px; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(12, 1fr); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; grid-column: span 12; }
.card h2 { font-size: 14px; font-weight: 600; margin: 0 0 2px; }
.card .sub { color: var(--muted); font-size: 12.5px; margin: 0 0 12px; }
@media (min-width: 760px) {
  .span-6 { grid-column: span 6; } .span-4 { grid-column: span 4; } .span-8 { grid-column: span 8; } .span-3 { grid-column: span 3; }
}
.kpis { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); grid-column: span 12; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.kpi .label { color: var(--muted); font-size: 12.5px; }
.kpi .value { font-size: 30px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.2; font-variant-numeric: tabular-nums; }
.kpi .value small { font-size: 15px; color: var(--muted); font-weight: 500; }
.kpi .hint { color: var(--muted); font-size: 12px; }
.goal { height: 6px; border-radius: 3px; background: var(--grid); margin-top: 8px; overflow: hidden; }
.goal i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
svg { display: block; overflow: visible; }
svg text { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.axis line, .gridline { stroke: var(--grid); stroke-width: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); margin: 0 0 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.bars { display: grid; gap: 6px; }
.bar-row { display: grid; grid-template-columns: minmax(70px, 34%) 1fr auto; align-items: center; gap: 10px; font-size: 13px; }
.bar-row .name { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-row .track { height: 10px; }
.bar-row .track i { display: block; height: 100%; min-width: 2px; background: var(--accent); border-radius: 0 4px 4px 0; }
.bar-row .num { font-variant-numeric: tabular-nums; color: var(--ink); min-width: 3ch; text-align: right; }
.funnel .bar-row { grid-template-columns: minmax(110px, 30%) 1fr auto; }
.funnel .num small { color: var(--muted); margin-left: 6px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 500; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
code { font-size: 12px; }
.empty { color: var(--muted); font-size: 13px; padding: 16px 0; }
.login { max-width: 420px; margin: 12vh auto 0; }
.login input { width: 100%; font: inherit; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); margin: 8px 0 12px; }
.login button.primary, .primary { font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 9px 16px; background: var(--accent); color: #fff; cursor: pointer; }
.error { color: var(--accent); font-size: 13px; }
.tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 6px 9px; border-radius: 6px; white-space: nowrap; z-index: 10; transform: translate(-50%, calc(-100% - 10px)); }
.tip[hidden] { display: none; }
.hit { fill: transparent; }
.chart-wrap { position: relative; }
.chart { width: 100%; }
.chart svg { width: 100%; }
.legend i.dash { width: 16px; height: 0; border-top: 1.5px dashed var(--ink-2); border-radius: 0; vertical-align: 3px; }

@media (min-width: 760px) { .events tbody { display: grid; grid-template-columns: 1fr 1fr; column-gap: 32px; } .events thead { display: none; } .events tr { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); } .events td { border: 0; } }
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<div class="tip" id="tip" hidden></div>
<script src="/stats/stats.js"></script>
</body>
</html>
